name: selftest

# Maintainer/fork-runnable reproduction harness (issue #9). Same steps 1-6 as
# build.yml (they're literally the same script, scripts/build.sh) with no
# attest and no staged artifact — just the logs, so a maintainer can diff
# their local `docker run ... bash scripts/build.sh` against this run.
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      stream:
        required: false
        type: string
        default: devel
      manifest_ref:
        required: false
        type: string
        default: main
  workflow_dispatch:
    inputs:
      package:
        required: true
        type: string
      stream:
        required: false
        type: string
        default: devel
      manifest_ref:
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.v.outputs.branch }}
      tag: ${{ steps.v.outputs.tag }}
      universe: ${{ steps.v.outputs.universe }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          versions=$(curl -fsSL "https://raw.githubusercontent.com/seandavi/bioc-manifest/${{ inputs.manifest_ref }}/versions.yaml")
          release=$(echo "$versions" | grep '^release_version' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${{ inputs.stream }}" = "release" ]; then
            branch="RELEASE_$(echo "$release" | tr . _)"; tag="$branch"; universe="bioc-release"
          else
            branch="devel"; tag="devel"; universe="bioc"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "universe=$universe" >> "$GITHUB_OUTPUT"

  selftest:
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:${{ needs.resolve.outputs.tag }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: build (resolve, fetch, deps, build, check, size)
        run: bash scripts/build.sh
        env:
          PACKAGE: ${{ inputs.package }}
          STREAM: ${{ inputs.stream }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          UNIVERSE: ${{ needs.resolve.outputs.universe }}
          MANIFEST_REF: ${{ inputs.manifest_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTAINER: bioconductor/bioconductor_docker:${{ needs.resolve.outputs.tag }}

      # no attest, no staged artifact (that's build.yml's job) -- logs only,
      # per SPEC-014.
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selftest-${{ inputs.package }}-${{ inputs.stream }}
          path: logs/**
          retention-days: 14
          if-no-files-found: warn

name: selftest

# Maintainer/fork-runnable reproduction harness (issue #9). Same steps 1-6 as
# build.yml (they're literally the same script, scripts/build.sh) with no
# attest and no staged artifact — just the logs, so a maintainer can diff
# their local `docker run ... bash scripts/build.sh` against this run.
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      stream:
        required: false
        type: string
        default: devel
      manifest_ref:
        required: false
        type: string
        default: main
  workflow_dispatch:
    inputs:
      package:
        required: true
        type: string
      stream:
        required: false
        type: string
        default: devel
      manifest_ref:
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: resolve stream -> branch/container tag
        id: stream
        run: |
          set -euo pipefail
          cfg=$(curl -fsSL https://bioconductor.org/config.yaml)
          release=$(echo "$cfg" | grep '^release_version' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${{ inputs.stream }}" = "release" ]; then
            branch="RELEASE_$(echo "$release" | tr . _)"
            tag="$branch"
          else
            branch="devel"
            tag="devel"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: work dir on /mnt
        id: work
        run: |
          set -euo pipefail
          work=/mnt/work
          sudo mkdir -p "$work" && sudo chown "$USER:$USER" "$work"
          mkdir -p "$work/scripts" "$work/logs"
          cp scripts/build.sh scripts/deps.R scripts/staged.R "$work/scripts/"
          echo "dir=$work" >> "$GITHUB_OUTPUT"

      - name: pull container
        id: image
        run: |
          image="bioconductor/bioconductor_docker:${{ steps.stream.outputs.tag }}"
          docker pull "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: build (resolve, fetch, deps, build, check, size)
        run: |
          docker run --rm \
            -v "${{ steps.work.outputs.dir }}:/work" -w /work \
            -e PACKAGE="${{ inputs.package }}" \
            -e STREAM="${{ inputs.stream }}" \
            -e BRANCH="${{ steps.stream.outputs.branch }}" \
            -e MANIFEST_REF="${{ inputs.manifest_ref }}" \
            -e RUN_ID="${{ github.run_id }}" \
            -e RUN_ATTEMPT="${{ github.run_attempt }}" \
            -e RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -e CONTAINER="${{ steps.image.outputs.image }}" \
            "${{ steps.image.outputs.image }}" bash /work/scripts/build.sh

      # no attest, no staged artifact (that's build.yml's job) -- logs only,
      # per SPEC-014.
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selftest-${{ inputs.package }}-${{ inputs.stream }}
          path: ${{ steps.work.outputs.dir }}/logs/**
          retention-days: 14
          if-no-files-found: warn

name: build

# Reusable build+check+attest+stage workflow (SPEC-014 §build.yml). The
# workflow_call and workflow_dispatch triggers share one job so dispatch.yml
# can `uses:` this file and a human can also run it directly.
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      stream:
        required: true
        type: string
      manifest_ref:
        required: false
        type: string
        default: main
  workflow_dispatch:
    inputs:
      package:
        required: true
        type: string
      stream:
        required: true
        type: string
      manifest_ref:
        required: false
        type: string
        default: main

# CLAUDE.md: exactly these three, nothing else, no secrets. Public repo.
permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  # `container:` on the build job needs its image known before that job
  # starts, and can't run shell itself -- so resolve it here first.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.v.outputs.branch }}
      tag: ${{ steps.v.outputs.tag }}
      universe: ${{ steps.v.outputs.universe }}
      container: ${{ steps.v.outputs.container }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          versions=$(curl -fsSL "https://raw.githubusercontent.com/seandavi/bioc-manifest/${{ inputs.manifest_ref }}/versions.yaml")
          release=$(echo "$versions" | grep '^release_version' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${{ inputs.stream }}" = "release" ]; then
            branch="RELEASE_$(echo "$release" | tr . _)"; tag="$branch"; universe="bioc-release"
          elif [ "${{ inputs.stream }}" = "devel" ]; then
            branch="devel"; tag="devel"; universe="bioc"
          else
            echo "unknown stream '${{ inputs.stream }}'" >&2; exit 1
          fi
          # anonymous Docker Hub registry API for the image digest; falls
          # back to the tag (ponytail: no retries) if this breaks.
          token=$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:bioconductor/bioconductor_docker:pull" | grep -o '"token":"[^"]*"' | cut -d'"' -f4) || true
          digest=$(curl -fsSL -I -H "Authorization: Bearer $token" -H "Accept: application/vnd.docker.distribution.manifest.v2+json" "https://registry-1.docker.io/v2/bioconductor/bioconductor_docker/manifests/$tag" | grep -i '^docker-content-digest:' | tr -d '\r' | awk '{print $2}') || true
          container="bioconductor/bioconductor_docker:$tag"
          [ -n "$digest" ] && container="bioconductor/bioconductor_docker@$digest"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "universe=$universe" >> "$GITHUB_OUTPUT"
          echo "container=$container" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:${{ needs.resolve.outputs.tag }}
    # ponytail: static, not policy.max_wall_minutes (a reusable/called workflow
    # can't take a dynamic value into timeout-minutes); 340 matches the
    # policy default. Revisit if a profile ever needs a longer budget.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # scripts/build.sh is steps 1-6 (resolve/fetch/deps/build/check/size);
      # it writes staged.json + events.ndjson + logs/ and the disk envelope
      # monitor (issue #10) lives inside it so selftest.yml gets it for free.
      # ubuntu-latest has plenty of free disk (~105G), so no free-disk-space
      # step or separate /mnt work dir -- the checkout dir is fine.
      - name: build (resolve, fetch, deps, build, check, size)
        run: bash scripts/build.sh
        env:
          PACKAGE: ${{ inputs.package }}
          STREAM: ${{ inputs.stream }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          UNIVERSE: ${{ needs.resolve.outputs.universe }}
          MANIFEST_REF: ${{ inputs.manifest_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTAINER: ${{ needs.resolve.outputs.container }}

      - name: attest tarball provenance
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./*.tar.gz

      # if: always() — a failed build still stages staged.json + logs +
      # events so the dispatcher/publisher learn the attempt happened.
      - name: upload staged artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-${{ inputs.package }}-${{ inputs.stream }}
          path: |
            ./*.tar.gz
            staged.json
            events.ndjson
            logs/**
          retention-days: 14
          if-no-files-found: warn

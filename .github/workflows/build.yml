name: build

# Reusable build+check+attest+stage workflow (SPEC-014 §build.yml). The
# workflow_call and workflow_dispatch triggers share one job so dispatch.yml
# can `uses:` this file and a human can also run it directly.
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      stream:
        required: true
        type: string
      manifest_ref:
        required: false
        type: string
        default: main
  workflow_dispatch:
    inputs:
      package:
        required: true
        type: string
      stream:
        required: true
        type: string
      manifest_ref:
        required: false
        type: string
        default: main

# CLAUDE.md: exactly these three, nothing else, no secrets. Public repo.
permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    # ponytail: static, not policy.max_wall_minutes (a reusable/called workflow
    # can't take a dynamic value into timeout-minutes); 340 matches the
    # policy default. Revisit if a profile ever needs a longer budget.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SPEC-004/010: free disk before anything else; ubuntu-latest has ~14GB
      # free, these removals recover ~25GB more.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: resolve stream -> branch/container tag
        id: stream
        run: |
          set -euo pipefail
          cfg=$(curl -fsSL https://bioconductor.org/config.yaml)
          release=$(echo "$cfg" | grep '^release_version' | sed -E 's/.*"([^"]+)".*/\1/')
          devel=$(echo "$cfg" | grep '^devel_version' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${{ inputs.stream }}" = "release" ]; then
            branch="RELEASE_$(echo "$release" | tr . _)"
            tag="$branch"
          elif [ "${{ inputs.stream }}" = "devel" ]; then
            branch="devel"
            tag="devel"
          else
            echo "unknown stream '${{ inputs.stream }}'" >&2
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: work dir on /mnt (more free space than the root disk)
        id: work
        run: |
          set -euo pipefail
          work=/mnt/work
          sudo mkdir -p "$work" && sudo chown "$USER:$USER" "$work"
          mkdir -p "$work/scripts" "$work/logs"
          cp scripts/build.sh scripts/deps.R scripts/staged.R "$work/scripts/"
          echo "dir=$work" >> "$GITHUB_OUTPUT"

      - name: pull container, record digest
        id: image
        run: |
          set -euo pipefail
          image="bioconductor/bioconductor_docker:${{ steps.stream.outputs.tag }}"
          docker pull "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # scripts/build.sh is steps 1-6 (resolve/fetch/deps/build/check/size);
      # it writes staged.json + events.ndjson + logs/ and the disk envelope
      # monitor (issue #10) lives inside it so selftest.yml gets it for free.
      - name: build (resolve, fetch, deps, build, check, size)
        run: |
          docker run --rm \
            -v "${{ steps.work.outputs.dir }}:/work" -w /work \
            -e PACKAGE="${{ inputs.package }}" \
            -e STREAM="${{ inputs.stream }}" \
            -e BRANCH="${{ steps.stream.outputs.branch }}" \
            -e MANIFEST_REF="${{ inputs.manifest_ref }}" \
            -e RUN_ID="${{ github.run_id }}" \
            -e RUN_ATTEMPT="${{ github.run_attempt }}" \
            -e RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -e CONTAINER="${{ steps.image.outputs.digest }}" \
            "${{ steps.image.outputs.image }}" bash /work/scripts/build.sh

      - name: attest tarball provenance
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.work.outputs.dir }}/*.tar.gz

      # if: always() — a failed build still stages staged.json + logs +
      # events so the dispatcher/publisher learn the attempt happened.
      - name: upload staged artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-${{ inputs.package }}-${{ inputs.stream }}
          path: |
            ${{ steps.work.outputs.dir }}/*.tar.gz
            ${{ steps.work.outputs.dir }}/staged.json
            ${{ steps.work.outputs.dir }}/events.ndjson
            ${{ steps.work.outputs.dir }}/logs/**
          retention-days: 14
          if-no-files-found: warn
